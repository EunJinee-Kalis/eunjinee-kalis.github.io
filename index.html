<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 시작 홈페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="https://www.sdu.ac.kr" target="_blank" rel="noopener" title="서울디지털대학교 홈페이지">
      <span class="logo-mark">SDU</span>
      <span class="logo-text">서울디지털대학교</span>
    </a>
    <div id="clock" class="clock"></div>
  </header>

  <main>
    <form class="search" action="https://www.google.com/search" method="get" target="_blank">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" name="q" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
    </form>
    <div class="buttons">
      <button type="button" id="search-btn">Google 검색</button>
      <button type="button" id="lucky-btn">I'm Feeling Lucky</button>
    </div>

    <section class="weather">
      <div class="weather-card" id="weather-seoul">
        <div class="city">서울</div>
        <div class="icon">⏳</div>
        <div class="temp">--°</div>
        <div class="desc">날씨 불러오는 중</div>
      </div>
      <div class="weather-card" id="weather-jeju">
        <div class="city">제주</div>
        <div class="icon">⏳</div>
        <div class="temp">--°</div>
        <div class="desc">날씨 불러오는 중</div>
      </div>
    </section>

    <blockquote class="quote">
      <p id="quote-text"></p>
      <cite id="quote-author"></cite>
      <button type="button" id="quote-btn" title="다른 명언 보기">↻</button>
    </blockquote>
  </main>

  <script src="script.js"></script>
</body>
</html>
